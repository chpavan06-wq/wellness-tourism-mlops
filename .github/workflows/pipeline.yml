name: Week 3 MLS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Dataset Registration
        run: |
          echo "Registering dataset..."

  data-preparation:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Data Preparation
        run: |
          echo "Preparing data..."

  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
       run: |
        pip install mlflow scikit-learn pandas joblib xgboost

      - name: Run Model Training & MLflow tracking
        run: |
          echo "Running model training and logging to MLflow..."
          python tourism_project/model_building/train.py

      - name: Commit and push trained model artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_machine_failure_model_v1.joblib
          git commit -m "chore: auto-commit trained model artifact [skip ci]" || echo "No changes to commit"
          git push
